month: 9
year: 1923
events:
  - date: "1923-09-01"
    title: "関東大震災"
    category: "災害"
    description: "11時58分、神奈川県西部を震源とするマグニチュード7.9の大正関東地震が発生した。東京・横浜などで建物の倒壊や大火災が起こり、津波や土砂災害も発生した。気象庁の解説では死者・行方不明者は10万5千人余とされる。"
    related_countries: ["日本"]
    sources:
      - "気象庁「関東大震災から100年・概要」 — https://www.data.jma.go.jp/eqev/data/1923_09_01_kantoujishin/gaiyo.html"
  - date: "1923-09-02"
    title: "関東大震災に伴う戒厳令の一部適用"
    category: "政治・経済"
    description: "震災後、緊急勅令により戒厳令の必要な規定を適用することが定められた。当初の対象は東京市と周辺5郡であり、この日に東京府全域と神奈川県へ適用されたわけではない。"
    related_countries: ["日本"]
    sources:
      - "アジア歴史資料センター「関東大震災と軍の救援活動」 — https://www.jacar.go.jp/topicsfromjacar/01_warissues/index01_005.html"
