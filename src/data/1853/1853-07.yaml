month: 7
year: 1853
events:
  - date: "1853-07-08"
    title: "ペリー来航（黒船来航）"
    category: "外交"
    description: "アメリカのペリー率いる4隻の艦隊が浦賀沖に来航し、アメリカ大統領の国書の受領を幕府に求めた。旧暦では嘉永6年6月3日。翌年の日米和親条約締結へとつながる交渉の始まりとなった。"
    related_countries: ["日本","アメリカ"]
    sources:
      - "外務省外交史料館「黒船来航」 — https://www.mofa.go.jp/mofaj/files/000179293.pdf"
      - "国立国会図書館「開国―近代の幕開け」 — https://www.ndl.go.jp/modern/cha1/description01.html"
