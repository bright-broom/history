    title: "阪神・淡路大震災"
    category: "災害"
    description: "5時46分、淡路島北部を震源とするマグニチュード7.3の兵庫県南部地震が発生した。神戸市などで震度7の揺れとなり、建物の倒壊や火災によって大きな被害が出た。"
