    description: "16時10分、石川県能登地方でマグニチュード7.6の地震が発生し、最大震度7を観測した。気象庁は、この地震と2020年12月以降の一連の地震活動を「令和6年能登半島地震」と命名した。"
    related_countries: ["日本"]
