month: 11
year: 1989
events:
  - date: "1989-11-09"
    title: "ベルリンの壁崩壊"
    category: "政治・経済"
    description: "東ドイツの出国・旅行規制に関する発表を受け、ベルリンの検問所に大勢の人々が集まった。その夜に検問所が開かれ、人々が東西を往来した。「壁崩壊」は、この国境開放を指す。"
    related_countries: ["ドイツ","アメリカ","ソ連"]
    sources:
      - "ドイツ連邦政府「Die Mauer ist offen!」 — https://www.bundesregierung.de/breg-de/schwerpunkte/deutsche-einheit/die-mauer-ist-offen--403858"
