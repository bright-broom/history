name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
  schedule:
    # Monthly security refresh; dependency security fixes remain event-driven.
    - cron: '17 20 1 * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'scheduled' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Keep this check name stable; docs-only PRs still get a successful check.
    name: ${{ github.event_name == 'schedule' && 'Security plan' || 'verify' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      security: ${{ steps.plan.outputs.security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select necessary checks
        id: plan
        run: node scripts/ci/plan.mjs
      - name: Review dependency changes
        if: github.event_name == 'pull_request' && steps.plan.outputs.dependencies == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
          show-openssf-scorecard: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.plan.outputs.verify == 'true'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        if: steps.plan.outputs.verify == 'true'
        run: npm ci --no-audit --no-fund
      - name: Check code and data
        if: steps.plan.outputs.verify == 'true'
        run: npm run check-all
      - name: Production build
        if: steps.plan.outputs.build == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
  security:
    name: CodeQL
    needs: verify
    if: needs.verify.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:javascript-typescript
